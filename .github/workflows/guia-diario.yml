name: Guia diário Univesp

on:
  schedule:
    # Antes rodava só às 8h. O site é aberto na hora de estudar, e depois que
    # o Josemar avançava no AVA o retrato ficava velho o dia inteiro: chegou a
    # mandar refazer atividade que ele já tinha concluído. Agora relê ao longo
    # do dia. Horários em UTC; Brasília é UTC-3 e não tem horário de verão.
    # Separado para identificar a rodada matinal pelo gatilho, mesmo se o
    # runner começar atrasado. Usar `date +%H` fazia perder o e-mail das 8h.
    - cron: "0 11 * * *"           # 8h de Brasília: site + e-mail
    - cron: "0 14,17,20,23 * * *"  # 11h, 14h, 17h e 20h: só site
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: guia-diario
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r automacao/requirements.txt
          python -m playwright install --with-deps chromium

      # Roda antes de tocar no AVA: se a lógica de prazos quebrou, é melhor
      # descobrir aqui do que publicar data errada no site.
      - name: Rodar testes
        run: |
          python testes/test_golden.py
          python testes/test_foruns.py
          python testes/test_isolamento_fontes.py
          python testes/test_prazos.py
          python testes/test_workshop_enviado.py
          python testes/test_login.py
          python testes/test_operacao.py
          # Estes três existiam desde 15/08 e nunca rodaram aqui: ficaram de
          # fora da lista quando foram escritos. Teste que não roda no CI é
          # teste que ninguém sabe que quebrou.
          python testes/test_participacao_forum.py
          python testes/test_portal.py
          python testes/test_revisao_entre_pares.py
          python testes/test_quadro.py

      # A sessão salva (Secret AVA_STORAGE_STATE) saiu em 13/08/2026. Ela era
      # um atalho para pular o login, e o log da rodada mostrou que o atalho
      # não atalhava nada: a sessão era restaurada, vencia, e o robô logava
      # com AVA_USUARIO/AVA_SENHA de qualquer jeito. Manter significava
      # carregar um cofre a mais e três scripts de manutenção para renová-la.
      - name: Gerar guia
        env:
          AVA_USUARIO: ${{ secrets.AVA_USUARIO }}
          AVA_SENHA: ${{ secrets.AVA_SENHA }}
        run: python automacao/gerar_guia.py

      # O login salva a sessão em disco durante a execução. Ela nunca sai do
      # runner, mas apagar é barato e fecha a porta.
      - name: Limpar sessão do runner
        if: always()
        run: rm -f automacao/storage_state.json

      # Publicar ANTES de avisar. Na ordem antiga o e-mail saía primeiro, e se
      # o push falhasse depois, o e-mail apontava para um site velho.
      - name: Publicar mudanças
        id: publicar
        run: |
          git config user.name "guia-univesp-bot"
          git config user.email "actions@users.noreply.github.com"
          PUBLICATION_ID=$(python -c "import json; print(json.load(open('docs/data.json', encoding='utf-8'))['publication_id'])")
          git add docs/
          if git diff --cached --quiet; then
            echo "Sem mudanças nesta leitura."
          else
            git commit -m "Atualização do guia ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi

          # Push não é deploy. Só libero o e-mail quando o mesmo artefato já
          # estiver sendo servido pelo Pages.
          #
          # A espera era de 3 minutos e falhou em 13/08/2026 com o deploy
          # levando 187s — 7 segundos além do limite. Os deploys daquele dia
          # variaram de 40s a 187s, então 3 minutos não era margem, era o
          # próprio tempo do caso ruim. Pior: ao desistir, o passo seguinte
          # empurrava outro commit e o Pages cancelava o deploy que estava
          # quase pronto. Oito minutos cobrem o pior caso observado com folga,
          # e esperar mais custa só tempo de runner — desistir cedo custa o
          # e-mail da manhã.
          PUBLICADO=""
          for TENTATIVA in $(seq 1 96); do
            REMOTO=$(curl -fsS -H "Cache-Control: no-cache" \
              "https://esdraaline.github.io/mentor-univesp-com170/data.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TENTATIVA}" \
              | python -c "import json,sys; print(json.load(sys.stdin).get('publication_id',''))" \
              2>/dev/null || true)
            if [ "$REMOTO" = "$PUBLICATION_ID" ]; then
              PUBLICADO=1
              echo "Pages confirmou o artefato $PUBLICATION_ID."
              break
            fi
            sleep 5
          done
          if [ -z "$PUBLICADO" ]; then
            echo "::error::O push terminou, mas o Pages não confirmou o artefato $PUBLICATION_ID em 8 minutos."
            exit 1
          fi

      # Sem continue-on-error: e-mail que para de chegar tem que ficar visível.
      # O site já foi publicado no passo acima, então falhar aqui não o perde.
      # O resumo continua sendo um por dia: cinco e-mails iguais viram ruído e
      # param de ser lidos. Mas prazo que o AVA publica às 14h não podia
      # esperar até as 8h do dia seguinte, então a rodada intermediária ganhou
      # voz própria — e ela só fala quando há prazo novo e perto.
      - name: Enviar resumo por e-mail
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          EVENTO: ${{ github.event_name }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          if [ "$AGENDA" = "0 11 * * *" ] || [ "$EVENTO" = "workflow_dispatch" ]; then
            python automacao/enviar_email.py
          else
            python automacao/enviar_email.py --alerta
          fi

      # Falha visível: se a leitura não foi confiável, a Action fica vermelha.
      # Silêncio aqui é o que faria o site dizer "tudo em dia" sem ter lido nada.
      - name: Verificar saúde da coleta
        run: |
          if grep -q '"status": "session_expired"' docs/data.json; then
            echo "::error::Não consegui entrar no AVA. Se os Secrets AVA_USUARIO/AVA_SENHA existem, a senha da Univesp pode ter mudado: rode automacao/salvar_credenciais.bat. Se ainda não existem, rode esse mesmo script para o robô passar a logar sozinho."
            exit 1
          fi
          if grep -q '"status": "coleta_incompleta"' docs/data.json; then
            echo "::error::Entrei no AVA mas a leitura veio incompleta, então mantive o último retrato válido. Motivos no docs/data.json (campo problemas) e no log do passo 'Gerar guia'. Provável mudança de layout do Moodle."
            exit 1
          fi
          if grep -q '"status": "coleta_degradada"' docs/data.json; then
            echo "::error::Atualizei as fontes saudáveis, mas pelo menos uma fonte falhou e usou cache. Consulte fontes_status no docs/data.json."
            exit 1
          fi

      # A Action vermelha só avisa quem lê notificação do GitHub. Se a rodada
      # morreu antes do passo de e-mail, nada chegava nele — e caixa de entrada
      # vazia é idêntica a "nada pendente". Vem por último para pegar também a
      # falha da verificação de saúde acima.
      - name: Avisar por e-mail que o robô não terminou
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          PASSO_FALHOU: ${{ github.job }} (rodada ${{ github.run_number }})
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python automacao/enviar_email.py --falha

      # Registra a data do envio para o próprio script pular reenvio se este
      # job for re-executado no mesmo dia (rerun manual, retry após falha nos
      # passos seguintes). Sem isso, um rerun manda o e-mail de novo do zero.
      # Roda mesmo com o job vermelho, senão o aviso de falha se repetiria a
      # cada uma das cinco rodadas de um dia ruim.
      - name: Registrar data do envio
        if: always()
        run: |
          git config user.name "guia-univesp-bot"
          git config user.email "actions@users.noreply.github.com"
          for marcador in automacao/.ultimo_email_enviado automacao/.ultimo_aviso_falha; do
            if [ -f "$marcador" ]; then git add "$marcador"; fi
          done
          if git diff --cached --quiet; then
            echo "Sem mudança nas datas de envio."
          else
            git commit -m "Registra data do envio do e-mail diário"
            git pull --rebase --autostash || true
            git push || echo "::warning::não consegui registrar a data do envio; no pior caso o aviso se repete na próxima rodada."
          fi
