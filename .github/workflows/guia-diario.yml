name: Guia diário Univesp

on:
  schedule:
    # Antes rodava só às 8h. O site é aberto na hora de estudar, e depois que
    # o Josemar avançava no AVA o retrato ficava velho o dia inteiro: chegou a
    # mandar refazer atividade que ele já tinha concluído. Agora relê ao longo
    # do dia. Horários em UTC; Brasília é UTC-3 e não tem horário de verão.
    # Separado para identificar a rodada matinal pelo gatilho, mesmo se o
    # runner começar atrasado. Usar `date +%H` fazia perder o e-mail das 8h.
    - cron: "0 11 * * *"           # 8h de Brasília: site + e-mail
    - cron: "0 14,17,20,23 * * *"  # 11h, 14h, 17h e 20h: só site
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: guia-diario
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r automacao/requirements.txt
          python -m playwright install --with-deps chromium

      # Roda antes de tocar no AVA: se a lógica de prazos quebrou, é melhor
      # descobrir aqui do que publicar data errada no site.
      - name: Rodar testes
        run: |
          python testes/test_golden.py
          python testes/test_foruns.py
          python testes/test_isolamento_fontes.py
          python testes/test_prazos.py
          python testes/test_login.py
          python testes/test_operacao.py

      # A sessão salva é só o atalho. Se não existir ou estiver vencida, o
      # robô loga sozinho com AVA_USUARIO/AVA_SENHA no passo seguinte.
      - name: Restaurar sessão salva (se houver)
        env:
          AVA_STORAGE_STATE: ${{ secrets.AVA_STORAGE_STATE }}
        run: |
          if [ -n "$AVA_STORAGE_STATE" ]; then
            echo "$AVA_STORAGE_STATE" > automacao/storage_state.json
            echo "Sessão salva restaurada."
          else
            echo "Sem sessão salva: o robô vai logar com as credenciais."
          fi

      # Se a sessão salva tiver vencido, o robô loga sozinho com estas
      # credenciais (guardadas no cofre de Secrets, nunca no repositório).
      - name: Gerar guia
        env:
          AVA_USUARIO: ${{ secrets.AVA_USUARIO }}
          AVA_SENHA: ${{ secrets.AVA_SENHA }}
        run: python automacao/gerar_guia.py

      - name: Limpar sessão do runner
        if: always()
        run: rm -f automacao/storage_state.json

      # Publicar ANTES de avisar. Na ordem antiga o e-mail saía primeiro, e se
      # o push falhasse depois, o e-mail apontava para um site velho.
      - name: Publicar mudanças
        id: publicar
        run: |
          git config user.name "guia-univesp-bot"
          git config user.email "actions@users.noreply.github.com"
          PUBLICATION_ID=$(python -c "import json; print(json.load(open('docs/data.json', encoding='utf-8'))['publication_id'])")
          git add docs/
          if git diff --cached --quiet; then
            echo "Sem mudanças nesta leitura."
          else
            git commit -m "Atualização do guia ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi

          # Push não é deploy. Só libero o e-mail quando o mesmo artefato já
          # estiver sendo servido pelo Pages.
          PUBLICADO=""
          for TENTATIVA in $(seq 1 36); do
            REMOTO=$(curl -fsS -H "Cache-Control: no-cache" \
              "https://esdraaline.github.io/mentor-univesp-com170/data.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TENTATIVA}" \
              | python -c "import json,sys; print(json.load(sys.stdin).get('publication_id',''))" \
              2>/dev/null || true)
            if [ "$REMOTO" = "$PUBLICATION_ID" ]; then
              PUBLICADO=1
              echo "Pages confirmou o artefato $PUBLICATION_ID."
              break
            fi
            sleep 5
          done
          if [ -z "$PUBLICADO" ]; then
            echo "::error::O push terminou, mas o Pages não confirmou o artefato $PUBLICATION_ID em 3 minutos."
            exit 1
          fi

      # Sem continue-on-error: e-mail que para de chegar tem que ficar visível.
      # O site já foi publicado no passo acima, então falhar aqui não o perde.
      # O site relê várias vezes ao dia, mas o e-mail continua sendo um por
      # dia: cinco e-mails viram ruído e param de ser lidos.
      - name: Enviar resumo por e-mail
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          EVENTO: ${{ github.event_name }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          if [ "$AGENDA" = "0 11 * * *" ] || [ "$EVENTO" = "workflow_dispatch" ]; then
            python automacao/enviar_email.py
          else
            echo "Rodada intermediária: só atualizo o site, o e-mail é o da manhã."
          fi

      # Falha visível: se a leitura não foi confiável, a Action fica vermelha.
      # Silêncio aqui é o que faria o site dizer "tudo em dia" sem ter lido nada.
      - name: Verificar saúde da coleta
        run: |
          if grep -q '"status": "session_expired"' docs/data.json; then
            echo "::error::Não consegui entrar no AVA. Se os Secrets AVA_USUARIO/AVA_SENHA existem, a senha da Univesp pode ter mudado: rode automacao/salvar_credenciais.bat. Se ainda não existem, rode esse mesmo script para o robô passar a logar sozinho."
            exit 1
          fi
          if grep -q '"status": "coleta_incompleta"' docs/data.json; then
            echo "::error::Entrei no AVA mas a leitura veio incompleta, então mantive o último retrato válido. Motivos no docs/data.json (campo problemas) e no log do passo 'Gerar guia'. Provável mudança de layout do Moodle."
            exit 1
          fi
